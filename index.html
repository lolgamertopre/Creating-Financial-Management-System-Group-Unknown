<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="Web-Based Personal Budget Tracker - An organized, offline-first personal financial management web application for income, expense, budget, and savings tracking." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <title>Web-Based Personal Budget Tracker</title>
    <script>
      // Early Error Logger: displays any unhandled syntax or runtime errors on screen
      window.addEventListener('error', function(e) {
        console.error('Window error captured:', e);
        var el = document.getElementById('early-error-banner');
        if (!el) {
          el = document.createElement('div');
          el.id = 'early-error-banner';
          el.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:#FEF2F2;border:1px solid #F87171;color:#991B1B;padding:16px;border-radius:12px;z-index:999999;font-family:sans-serif;font-size:13px;box-shadow:0 4px 6px rgba(0,0,0,0.1);';
          document.body ? document.body.appendChild(el) : document.documentElement.appendChild(el);
        }
        el.innerHTML = '<strong>Application Error:</strong> ' + (e.message || 'Unknown startup error') + 
          '<div style="font-size:11px;margin-top:6px;color:#7F1D1D;font-family:monospace;">' + (e.filename || '') + ':' + (e.lineno || '') + '</div>' +
          '<button onclick="localStorage.clear();sessionStorage.clear();indexedDB.deleteDatabase(\'FinancialManagementDB\');window.location.reload();" style="margin-top:10px;padding:6px 12px;background:#DC2626;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:11px;">Clear Local Data &amp; Reload</button>';
      });
    </script>
  </head>
  <body class="bg-[#F0F2F8] text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F0F2F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="width: 56px; height: 56px; border-radius: 18px; background: linear-gradient(135deg, #6366F1, #4F46E5); display: flex; align-items: center; justify-content: center; color: white; font-size: 28px; box-shadow: 0 10px 25px -5px rgba(79,70,229,0.3); margin-bottom: 16px;">
          ₱
        </div>
        <div style="font-size: 18px; font-weight: 800; color: #0F172A; letter-spacing: -0.02em;">Personal Budget Tracker</div>
        <div style="font-size: 13px; color: #64748B; margin-top: 6px;">Loading your financial dashboard...</div>
      </div>
    </div>
    <script type="module" src="/index.jsx"></script>
  </body>
</html>
